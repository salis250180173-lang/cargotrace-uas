[phases.setup]
nixPkgs = [
  "php85",
  "php85Packages.composer",
  "php85Extensions.pdo_mysql",
  "php85Extensions.mbstring",
  "php85Extensions.xml",
  "php85Extensions.curl",
  "php85Extensions.zip",
  "php85Extensions.bcmath",
  "php85Extensions.gd"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader"
]

[phases.build]
cmds = [
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"

